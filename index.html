<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>受付トレーナー</title>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 16px;
}

.header {
  text-align: center;
  margin-bottom: 15px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

h1 {
  font-size: 24px;
}

h2 {
  font-size: 20px;
}

.progress {
  font-size: 14px;
  color: #666;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  background: #222;
  color: white;
}

.option {
  background: #eeeeee;
  color: #222;
}

button:active {
  transform: scale(0.98);
}

.hidden {
  display: none;
}

.check {
  font-size: 18px;
  line-height: 1.8;
}

.score {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
}

.good {
  color: #16823b;
}

.warning {
  color: #d97706;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>📱 受付トレーナー</h1>
<p>ヒアリング → 見積もり</p>
</div>

<div id="start" class="card">

<h2>CASE 001</h2>

<p>
お客様から話を聞き、見積もりに必要な情報を集めましょう。
</p>

<p>
<strong>目標：</strong><br>
必要な情報を漏れなく確認する。
</p>

<button onclick="startTraining()">
トレーニング開始
</button>

</div>


<div id="questionArea" class="card hidden">

<div class="progress" id="progress"></div>

<h2 id="question"></h2>

<div id="options"></div>

</div>


<div id="resultArea" class="card hidden">

<h2>ヒアリング結果</h2>

<div class="score" id="score"></div>

<div class="check" id="checkList"></div>

<br>

<p id="message"></p>

<button onclick="location.reload()">
もう一度挑戦
</button>

</div>

</div>


<script>

let currentQuestion = 0;

let score = 0;


/*
ここがヒアリング項目です。

後から質問や選択肢を変更できます。
*/

const questions = [

{
title: "STEP 1",
question: "現在、どこの携帯会社を利用していますか？",

options: [
"au",
"UQ mobile",
"ドコモ",
"ソフトバンク",
"楽天モバイル",
"その他"
],

answer: null
},

{
title: "STEP 2",
question: "ご自宅ではインターネットを利用されていますか？",

options: [
"利用している",
"利用していない",
"分からない"
],

answer: null
},

{
title: "STEP 3",
question: "ご自宅のインターネットは、どちらをご利用ですか？",

options: [
"光回線",
"ホームルーター",
"ケーブルテレビ",
"その他",
"分からない"
],

answer: null
},

{
title: "STEP 4",
question: "ご家族も携帯電話を利用されていますか？",

options: [
"利用している",
"利用していない",
"分からない"
],

answer: null
},

{
title: "STEP 5",
question: "ご家族は、どこの携帯会社を利用していますか？",

options: [
"au",
"UQ mobile",
"ドコモ",
"ソフトバンク",
"楽天モバイル",
"その他・分からない"
],

answer: null
},

{
title: "STEP 6",
question: "現在利用している機種は何ですか？",

options: [
"iPhone",
"Android",
"その他",
"分からない"
],

answer: null
},

{
title: "STEP 7",
question: "現在の機種をどのくらい利用していますか？",

options: [
"1年未満",
"1〜2年",
"2〜3年",
"3年以上",
"分からない"
],

answer: null
},

{
title: "STEP 8",
question: "現在の携帯料金は、月額どのくらいですか？",

options: [
"3,000円未満",
"3,000〜5,000円",
"5,000〜8,000円",
"8,000円以上",
"分からない"
],

answer: null
},

{
title: "STEP 9",
question: "毎月のデータ使用量はどのくらいですか？",

options: [
"1GB未満",
"1〜3GB",
"3〜10GB",
"10〜20GB",
"20GB以上",
"分からない"
],

answer: null
},

{
title: "STEP 10",
question: "通話はどのくらい利用されていますか？",

options: [
"ほとんどしない",
"短い通話が中心",
"長電話が多い",
"よく分からない"
],

answer: null
},

{
title: "STEP 11",
question: "現在の携帯電話について、不満や希望はありますか？",

options: [
"料金を安くしたい",
"データ容量を増やしたい",
"通話を充実させたい",
"機種を新しくしたい",
"特にない",
"その他"
],

answer: null
},

{
title: "STEP 12",
question: "機種変更する場合、希望する機種はありますか？",

options: [
"希望機種がある",
"iPhoneを希望",
"Androidを希望",
"特に決まっていない",
"機種変更は考えていない"
],

answer: null
},

{
title: "STEP 13",
question: "ここまでの内容をもとに、キャンペーンも含めて一度お見積もりしてみませんか？",

options: [
"はい、お見積もりをお願いします",
"もう少し話を聞きたい",
"今回は見積もり不要"
],

answer: "はい、お見積もりをお願いします"
}

];


function startTraining() {

document.getElementById("start")
.classList.add("hidden");

document.getElementById("questionArea")
.classList.remove("hidden");

showQuestion();

}


function showQuestion() {

const q = questions[currentQuestion];

document.getElementById("progress").innerText =
q.title + "　" +
(currentQuestion + 1) +
" / " +
questions.length;

document.getElementById("question").innerText =
q.question;

const options =
document.getElementById("options");

options.innerHTML = "";

q.options.forEach(function(option) {

const button =
document.createElement("button");

button.innerText = option;

button.className = "option";

button.onclick = function() {

checkAnswer(option);

};

options.appendChild(button);

});

}


function checkAnswer(selected) {

const q = questions[currentQuestion];


/*
STEP13だけ、
「見積もりへ進めるか」を評価します。
*/

if(q.answer !== null) {

if(selected === q.answer) {

score++;

}

} else {

/*
現在はヒアリング内容を
「聞けた」こと自体を評価します。
*/

score++;

}


currentQuestion++;


if(currentQuestion < questions.length) {

showQuestion();

} else {

showResult();

}

}


function showResult() {

document.getElementById("questionArea")
.classList.add("hidden");

document.getElementById("resultArea")
.classList.remove("hidden");


const percent =
Math.round(score / questions.length * 100);


document.getElementById("score").innerText =
percent + "点";


let message = "";

if(percent >= 90) {

message =
"🎉 ヒアリング完了！次は見積もりに進みましょう。";

} else if(percent >= 70) {

message =
"👍 もう少しです。聞き漏れを復習しましょう。";

} else {

message =
"📚 もう一度ヒアリングの流れを復習しましょう。";

}


document.getElementById("message").innerText =
message;


let list = "";

questions.forEach(function(q, index) {

list +=
"✅ " +
(index + 1) +
". " +
q.title +
"<br>";

});


document.getElementById("checkList").innerHTML =
list;

}

</script>

</body>
</html>
